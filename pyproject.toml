[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sauce-me-up-rnjesus"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  # Runtime since Package 3: the pooled upstream transport
  # (src/http_client.py). Exact-pinned like the other runtime deps.
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["src", "backend", "backend.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
