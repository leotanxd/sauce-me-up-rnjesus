name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Hash-locked dev environment (Package 5): exact versions +
      # hashes frozen in requirements-dev.txt; the project itself is
      # installed on top with --no-deps.
      - run: pip install --require-hashes -r api/requirements-dev.txt
      - run: pip install --no-deps -e api
      - run: pytest
        working-directory: api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm test && npm run build
        working-directory: web

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r api/requirements-dev.txt
      - run: pip install --no-deps -e api
      - run: ruff check sauce_me_up tests
        working-directory: api
      - run: ruff format --check sauce_me_up tests
        working-directory: api
      - run: mypy sauce_me_up
        working-directory: api

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install --require-hashes -r api/requirements-dev.txt
      - run: pip install --no-deps -e api
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      # The suite serves the real app against a stub upstream
      # (web/e2e/stub-server.py) — hermetic, no live network.
      - run: npm run test:e2e
        working-directory: web
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
